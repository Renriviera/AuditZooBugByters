rules:
- id: python-os-command-injection-shell-true
  patterns:
  - pattern-either:
    - pattern: subprocess.Popen($CMD, shell=True, ...)
    - pattern: Popen($CMD, shell=True, ...)
    - pattern: os.system($CMD)
    - pattern: subprocess.getstatusoutput($CMD)
    - pattern: subprocess.call($CMD, shell=True, ...)
    - pattern: subprocess.run($CMD, shell=True, ...)
    - pattern: subprocess.check_output($CMD, shell=True, ...)
  message: Potential OS command injection via shell execution
  languages:
  - python
  severity: ERROR
  metadata:
    cwe: CWE-78
    sink_api: shell execution
- id: python-os-command-injection-command-string
  patterns:
  - pattern-either:
    - pattern: subprocess.Popen(f"...", ...)
    - pattern: Popen(f"...", ...)
    - pattern: os.system(f"...")
    - pattern: subprocess.run(f"...", ...)
    - pattern: subprocess.call(f"...", ...)
    - pattern: subprocess.check_output(f"...", ...)
    - pattern: subprocess.getstatusoutput(f"...")
    - pattern: os.popen(f"...")
  message: Potential OS command injection via interpolated command string
  languages:
  - python
  severity: ERROR
  metadata:
    cwe: CWE-78
    sink_api: command string
- id: python-os-command-injection-execute-command-wrapper
  patterns:
  - pattern-either:
    - pattern: $OBJ.execute_command($CMD)
    - pattern: $OBJ.execute_command_by_uuid(..., $CMD)
    - pattern: $OBJ.execute_command_current_termbox($CMD)
    - pattern: $OBJ.run_command($CMD, ...)
    - pattern: $OBJ.run($CMD, ...)
    - pattern: $OBJ.call($CMD, ...)
  message: Potential OS command injection through command execution wrapper
  languages:
  - python
  severity: ERROR
  metadata:
    cwe: CWE-78
    sink_api: call
