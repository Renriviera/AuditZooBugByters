# Command-execution sink APIs for CWE-78 detection (15 APIs).

sinks:
  - api: "os.system"
    severity: critical
    shell_param: false        # always shell
  - api: "os.popen"
    severity: critical
    shell_param: false
  - api: "os.execvp"
    severity: high
    shell_param: false
  - api: "os.execvpe"
    severity: high
    shell_param: false
  - api: "subprocess.run"
    severity: critical
    shell_param: true         # dangerous when shell=True
  - api: "subprocess.call"
    severity: critical
    shell_param: true
  - api: "subprocess.Popen"
    severity: critical
    shell_param: true
  - api: "subprocess.check_output"
    severity: high
    shell_param: true
  - api: "subprocess.check_call"
    severity: high
    shell_param: true
  - api: "subprocess.getoutput"
    severity: high
    shell_param: false
  - api: "subprocess.getstatusoutput"
    severity: high
    shell_param: false
  - api: "commands.getoutput"
    severity: high
    shell_param: false
    legacy: true
  - api: "commands.getstatusoutput"
    severity: high
    shell_param: false
    legacy: true
  - api: "pty.spawn"
    severity: high
    shell_param: false
  - api: "fabric.run"
    severity: medium
    shell_param: false
    framework: fabric

  # ``os.exec*`` family — replaces the current process with a new program
  # using attacker-controlled argv.  Always shell-free, but a tainted argv
  # can still be ``CWE-78`` (e.g. ``os.execvp("/bin/sh", argv)``).
  - api: "os.execv"
    severity: high
    shell_param: false
  - api: "os.execve"
    severity: high
    shell_param: false
  - api: "os.execl"
    severity: high
    shell_param: false
  - api: "os.execle"
    severity: high
    shell_param: false
  - api: "os.execlp"
    severity: high
    shell_param: false
  - api: "os.execlpe"
    severity: high
    shell_param: false

  # ``os.spawn*`` family — same threat model as exec*.
  - api: "os.spawnv"
    severity: high
    shell_param: false
  - api: "os.spawnve"
    severity: high
    shell_param: false
  - api: "os.spawnvp"
    severity: high
    shell_param: false
  - api: "os.spawnvpe"
    severity: high
    shell_param: false
  - api: "os.spawnl"
    severity: high
    shell_param: false
  - api: "os.spawnle"
    severity: high
    shell_param: false
  - api: "os.spawnlp"
    severity: high
    shell_param: false
  - api: "os.spawnlpe"
    severity: high
    shell_param: false

  # asyncio subprocess primitives — the ``_shell`` variant is shell-true by
  # construction; ``_exec`` is shell-free but can still be tainted via argv.
  - api: "asyncio.create_subprocess_shell"
    severity: critical
    shell_param: false
  - api: "asyncio.create_subprocess_exec"
    severity: high
    shell_param: false
