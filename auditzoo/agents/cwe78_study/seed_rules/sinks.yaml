# Command-execution sink APIs for CWE-78 detection (43 APIs).

sinks:
  - api: "os.system"
    severity: critical
    shell_param: false        # always shell
  - api: "os.popen"
    severity: critical
    shell_param: false
  - api: "os.popen2"
    severity: high
    shell_param: false
    legacy: true
  - api: "os.popen3"
    severity: high
    shell_param: false
    legacy: true
  - api: "os.popen4"
    severity: high
    shell_param: false
    legacy: true
  - api: "os.execv"
    severity: high
    shell_param: false
  - api: "os.execve"
    severity: high
    shell_param: false
  - api: "os.execvp"
    severity: high
    shell_param: false
  - api: "os.execvpe"
    severity: high
    shell_param: false
  - api: "os.execl"
    severity: high
    shell_param: false
  - api: "os.execle"
    severity: high
    shell_param: false
  - api: "os.execlp"
    severity: high
    shell_param: false
  - api: "os.execlpe"
    severity: high
    shell_param: false
  - api: "os.spawnv"
    severity: high
    shell_param: false
