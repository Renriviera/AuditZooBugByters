    severity: high
    shell_param: true
  - api: "subprocess.getoutput"
    severity: high
    shell_param: false
  - api: "subprocess.getstatusoutput"
    severity: high
    shell_param: false
  - api: "commands.getoutput"
    severity: high
    shell_param: false
    legacy: true
  - api: "commands.getstatusoutput"
    severity: high
    shell_param: false
    legacy: true
  - api: "pty.spawn"
    severity: high
    shell_param: false
  - api: "pexpect.spawn"
    severity: high
    shell_param: false
    framework: pexpect
