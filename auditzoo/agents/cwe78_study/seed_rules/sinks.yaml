    severity: high
    shell_param: false
  - api: "os.spawnlpe"
    severity: high
    shell_param: false
  - api: "asyncio.create_subprocess_shell"
    severity: critical
    shell_param: false
  - api: "asyncio.create_subprocess_exec"
    severity: high
    shell_param: false
  - api: "subprocess.run"
    severity: critical
    shell_param: true         # dangerous when shell=True
  - api: "subprocess.call"
    severity: critical
    shell_param: true
  - api: "subprocess.Popen"
    severity: critical
    shell_param: true
