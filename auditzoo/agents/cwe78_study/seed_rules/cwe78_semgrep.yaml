rules:
  - id: cwe78-os-system
    patterns:
      - pattern: os.system($ARG)
      - pattern-not: os.system("...")
    message: "Non-literal argument to os.system() — potential CWE-78"
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-78"
      sink_api: "os.system"

  - id: cwe78-os-popen
    patterns:
      - pattern: os.popen($ARG)
      - pattern-not: os.popen("...")
    message: "Non-literal argument to os.popen() — potential CWE-78"
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-78"
      sink_api: "os.popen"

  - id: cwe78-sub-run
    patterns:
      - pattern: subprocess.run($CMD, ..., shell=True, ...)
    message: "subprocess.run with shell=True — potential CWE-78"
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-78"
      sink_api: "subprocess.run"

  - id: cwe78-sub-call
    patterns:
      - pattern: subprocess.call($CMD, ..., shell=True, ...)
    message: "subprocess.call with shell=True — potential CWE-78"
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-78"
      sink_api: "subprocess.call"

  - id: cwe78-sub-popen
    patterns:
      - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
    message: "subprocess.Popen with shell=True — potential CWE-78"
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-78"
      sink_api: "subprocess.Popen"

  - id: cwe78-sub-chkout
    patterns:
      - pattern: subprocess.check_output($CMD, ..., shell=True, ...)
    message: "subprocess.check_output with shell=True — potential CWE-78"
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-78"
      sink_api: "subprocess.check_output"

  - id: cwe78-sub-chkcall
    patterns:
      - pattern: subprocess.check_call($CMD, ..., shell=True, ...)
    message: "subprocess.check_call with shell=True — potential CWE-78"
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-78"
      sink_api: "subprocess.check_call"

  - id: cwe78-concat
    pattern-either:
      - pattern: os.system($X + $Y)
      - pattern: os.popen($X + $Y)
      - pattern: subprocess.run($X + $Y, ..., shell=True, ...)
      - pattern: subprocess.call($X + $Y, ..., shell=True, ...)
      - pattern: subprocess.Popen($X + $Y, ..., shell=True, ...)
      - pattern: subprocess.check_output($X + $Y, ..., shell=True, ...)
      - pattern: subprocess.check_call($X + $Y, ..., shell=True, ...)
    message: "String concatenation in command argument — potential CWE-78"
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-78"
      sink_api: "concat"
