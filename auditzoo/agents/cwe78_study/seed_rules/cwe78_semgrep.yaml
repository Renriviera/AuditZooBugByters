rules:
- id: cwe78-os-system
  mode: taint
  pattern-sources:
  - pattern: sys.argv
    exact: true
  - pattern: input(...)
    exact: true
  - pattern: sys.stdin.read(...)
    exact: true
  - pattern: os.environ
    exact: true
  - pattern: os.environ[$KEY]
    exact: true
  - pattern: os.getenv(...)
    exact: true
  - pattern: argparse.ArgumentParser(...).parse_args(...)
    exact: true
  - pattern: $PARSER.parse_args(...)
    exact: true
  - patterns:
    - pattern-inside: "@click.$DECORATOR(...)\ndef $FUNC(..., $PARAM, ...):\n  ...\n"
    - focus-metavariable: $PARAM
  - patterns:
    - pattern-inside: "@typer.$DECORATOR(...)\ndef $FUNC(..., $PARAM, ...):\n  ...\n"
    - focus-metavariable: $PARAM
  - pattern: request.args
    exact: true
  - pattern: request.args.get(...)
    exact: true
  - pattern: request.args[$KEY]
    exact: true
  - pattern: request.form
    exact: true
  - pattern: request.form.get(...)
    exact: true
  - pattern: request.form[$KEY]
    exact: true
  - pattern: request.values
    exact: true
  - pattern: request.values.get(...)
    exact: true
  - pattern: request.get_json(...)
    exact: true
  - pattern: request.json
    exact: true
  - pattern: request.data
    exact: true
  - pattern: request.headers
    exact: true
  - pattern: request.headers.get(...)
    exact: true
  - pattern: request.GET
    exact: true
  - pattern: request.GET.get(...)
    exact: true
  - pattern: request.GET[$KEY]
    exact: true
  - pattern: request.POST
    exact: true
  - pattern: request.POST.get(...)
    exact: true
  - pattern: request.POST[$KEY]
    exact: true
  - pattern: request.FILES
    exact: true
  - pattern: request.query_params
    exact: true
  - pattern: request.query_params.get(...)
    exact: true
  - pattern: request.path_params
    exact: true
  - patterns:
    - pattern-inside: "@$APP.route(...)\ndef $FUNC(..., $PARAM, ...):\n  ...\n"
    - focus-metavariable: $PARAM
  - patterns:
    - pattern-inside: "@$APP.$METHOD(...)\ndef $FUNC(..., $PARAM, ...):\n  ...\n"
    - focus-metavariable: $PARAM
  - pattern: module.params
    exact: true
  - pattern: module.params[$KEY]
    exact: true
  - pattern: module.params.get(...)
    exact: true
  - pattern: params[$KEY]
    exact: true
  - pattern: params.get(...)
    exact: true
  - pattern: yaml.safe_load(...)
    exact: true
  - pattern: yaml.load(...)
    exact: true
  - pattern: json.load(...)
    exact: true
  - pattern: json.loads(...)
    exact: true
  - pattern: toml.load(...)
    exact: true
  - pattern: open(...).read(...)
    exact: true
  - pattern: $FILE.read(...)
    exact: true
  - pattern: socket.recv(...)
    exact: true
  - pattern: requests.$METHOD(...).text
    exact: true
  - pattern: $CONFIG.get(...)
    exact: true
  - pattern: $CONFIG[$KEY]
    exact: true
  pattern-sinks:
  - pattern: os.system($CMD)
  pattern-sanitizers:
  - pattern: shlex.quote(...)
  - pattern: pipes.quote(...)
  - pattern: subprocess.list2cmdline(...)
  message: User-controlled input reaches os.system() - potential CWE-78
  languages:
  - python
  severity: ERROR
  metadata:
    cwe: CWE-78
    sink_api: os.system
    source_families:
    - cli
    - web
    - ansible_module
    - config_file
    - network
    - orchestration
